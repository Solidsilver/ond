name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      # ALSA and PipeWire headers for audio output, clang for PipeWire's
      # bindings, and Mesa's software Vulkan for the offscreen UI snapshots.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libpipewire-0.3-dev clang pkg-config mesa-vulkan-drivers

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Hardware-dependent tests are #[ignore]d and stay skipped here.
      - name: Test
        run: cargo test --workspace --no-fail-fast
