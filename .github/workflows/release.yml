name: Release

on:
  push:
    tags: ["v*"]
  # Builds and uploads the bundles without publishing, to try the packaging.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The bundle's build number is the commit count.
          fetch-depth: 0

      - name: Install Rust (stable, both macOS architectures)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --no-fail-fast

      - name: Bundle
        run: scripts/bundle-macos.sh --universal

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            target/bundle/*.dmg
            target/bundle/*.zip

  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    # The oldest Ubuntu with libpipewire 0.3.53+, which the PipeWire output
    # needs. The binary runs on glibc 2.39 and later.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libpipewire-0.3-dev clang pkg-config mesa-vulkan-drivers

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --no-fail-fast

      - name: Bundle
        run: scripts/bundle-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.runner }}
          path: target/bundle/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --no-fail-fast

      - name: Bundle
        run: pwsh scripts/bundle-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/bundle/*.zip

  publish:
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
