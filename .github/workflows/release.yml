name: Release

# Ond and Rede release from this repository, each from tags of its own:
# `ond-v0.5.0`, `rede-v0.1.0`. Ond's tags before Rede were `v0.4.4`, and a
# `v*` tag is still Ond's. Only the tagged app is built.
on:
  push:
    tags: ["v*", "ond-v*", "rede-v*"]
  # Builds and uploads Ond's bundles without publishing, to try the packaging.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # These builds look for newer releases (apps/ond/src/updates.rs).
  OND_DISTRIBUTION: github

jobs:
  # Which app the tag is for and the version it names. A tag must name the
  # version the app's crate has: the bundles are named from the crate, and
  # an app that thinks it's older than its own release keeps offering it.
  tag:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.tag.outputs.app }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: App and version
        id: tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/ond-v*) app=ond; version="${GITHUB_REF_NAME#ond-v}" ;;
            refs/tags/rede-v*) app=rede; version="${GITHUB_REF_NAME#rede-v}" ;;
            refs/tags/v*) app=ond; version="${GITHUB_REF_NAME#v}" ;;
            # Run by hand from a branch: Ond, built but not published.
            *) app=ond; version="" ;;
          esac
          if [ "$app" = ond ] && [ -n "$version" ]; then
            crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ond-player") | .version')"
            if [ "$crate" != "$version" ]; then
              echo "::error::$GITHUB_REF_NAME names $version, but ond-player is $crate"
              exit 1
            fi
          fi
          if [ "$app" = rede ]; then
            echo "::notice::Rede has no bundles yet, so $GITHUB_REF_NAME builds nothing."
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Rede's bundle jobs go after Ond's, each gated on
  # `needs.tag.outputs.app == 'rede'`, once Rede has bundle scripts beside
  # Ond's in scripts/. Until then a `rede-v*` tag runs only the job above.

  macos:
    needs: tag
    if: needs.tag.outputs.app == 'ond'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The bundle's build number is the commit count.
          fetch-depth: 0

      - name: Install Rust (stable, both macOS architectures)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --no-fail-fast

      # Developer ID signing and notarization, when the secrets are set (see
      # docs/macos-signing.md). Without them the app is signed ad hoc.
      - name: Signing keychain
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "No MACOS_CERTIFICATE secret: the app will be signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$identity" ]; then
            echo "The certificate has no Developer ID Application identity" >&2
            exit 1
          fi
          echo "OND_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_KEY" ]; then
            echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
            {
              echo "OND_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
              echo "OND_NOTARY_KEY_ID=$NOTARY_KEY_ID"
              echo "OND_NOTARY_ISSUER=$NOTARY_ISSUER"
            } >> "$GITHUB_ENV"
          fi

      - name: Bundle
        run: scripts/bundle-macos.sh --universal

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            target/bundle/*.dmg
            target/bundle/*.zip

  linux:
    needs: tag
    if: needs.tag.outputs.app == 'ond'
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    # The oldest Ubuntu with libpipewire 0.3.53+, which the PipeWire output
    # needs. The binary runs on glibc 2.39 and later.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libpipewire-0.3-dev clang pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --no-fail-fast

      - name: Bundle
        run: scripts/bundle-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.runner }}
          path: target/bundle/*.tar.gz

  windows:
    needs: tag
    if: needs.tag.outputs.app == 'ond'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --no-fail-fast

      - name: Bundle
        run: pwsh scripts/bundle-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/bundle/*.zip

  publish:
    needs: [tag, macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/') && needs.tag.outputs.app == 'ond'
    runs-on: ubuntu-latest
    env:
      APP: ${{ needs.tag.outputs.app }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/release-notes
          # The tags, to find this app's previous release.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Hand-written notes for this version, if there are any, above GitHub's
      # changelog: .github/release-notes/ond/v0.5.0.md for ond-v0.5.0 (or v0.5.0).
      - name: Release notes
        run: |
          notes=".github/release-notes/$APP/v$VERSION.md"
          [ -f "$notes" ] || : > "$notes"
          echo "notes=$notes" >> "$GITHUB_ENV"

      # GitHub's changelog starts from the release before, which would be
      # whichever app released last; this is Ond's own previous tag, either form.
      - name: Previous release
        run: |
          previous="$(
            git tag -l 'v*' 'ond-v*' | grep -E '^(ond-)?v[0-9]+\.[0-9]+\.[0-9]+$' |
              while read -r t; do echo "${t#*v} $t"; done |
              sort -V | awk -v v="$VERSION" '$1 == v { print prev; exit } { prev = $2 }'
          )"
          echo "Previous Ond release: ${previous:-none}"
          echo "previous=$previous" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: Ond ${{ needs.tag.outputs.version }}
          body_path: ${{ env.notes }}
          generate_release_notes: true
          previous_tag: ${{ env.previous }}
          files: dist/*
