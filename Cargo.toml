[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# egui 0.37 needs 1.95; the code itself uses let-chains (stable since 1.88).
rust-version = "1.95"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release: one codegen unit and thin LTO let the optimiser see across crates
# (symphonia, rubato and the engine meet in the decode loop). Panics must keep
# unwinding: the decode and analysis threads turn a panic into an error with
# `catch_unwind`.
[profile.release]
lto = "thin"
codegen-units = 1

# Debug builds: dependencies (decoders, resampler, FFT, wgpu) are optimised so
# `cargo run` plays without dropouts and the timing-sensitive tests aren't
# starved; the workspace's own crates stay unoptimised for quick rebuilds.
[profile.dev.package."*"]
opt-level = 2
