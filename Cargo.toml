[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# egui 0.37 needs 1.95; the code itself uses let-chains (stable since 1.88).
rust-version = "1.95"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
