[package]
name = "audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
streamcache = { version = "0.4.0", path = "../streamcache" }
rtrb = "0.4.0"
symphonia = { version = "0.6.1", features = ["all"] }
thiserror = "2.0.21"
tracing = "0.1.44"
rubato = "5.0.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = "0.14.2"
libc = "0.2"
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }

[features]
# Lets UI previews and tests put `Status` into a state without a running stream.
preview = []

[target.'cfg(target_os = "linux")'.dependencies]
# PipeWire's own API where it's running (cpal falls back to ALSA otherwise).
# Builds against libpipewire-0.3, which every current desktop distro ships.
cpal = { version = "0.18.2", features = ["pipewire"] }
# Bit-perfect mode: the card's hw: device directly (already under cpal), once
# the sound server has let go of it (D-Bus device reservation).
alsa = "0.11.0"
libc = "0.2"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
# The flags zbus takes for a bus name request (it doesn't re-export the type).
enumflags2 = "0.7.12"
# The default sink, which cpal's PipeWire host doesn't say (already under cpal).
pipewire = "0.10.1"
