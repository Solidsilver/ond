[package]
name = "subsonic"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hex = "0.4.3"
md5 = { package = "md-5", version = "0.11.0" }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
