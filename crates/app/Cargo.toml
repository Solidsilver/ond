[package]
name = "listener"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
audio = { version = "0.1.0", path = "../audio" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.37.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = "4.2.0"
library = { version = "0.1.0", path = "../library" }
nucleo-matcher = "0.3.1"
offline = { version = "0.1.0", path = "../offline" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subsonic = { version = "0.1.0", path = "../subsonic" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
# Offscreen rendering for the review snapshots (`app/snapshots.rs`).
audio = { version = "0.1.0", path = "../audio", features = ["preview"] }
egui_kittest = { version = "0.37.0", features = ["wgpu"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSImage", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSValue", "NSDictionary", "NSData", "NSObject", "NSURL"] }
objc2-media-player = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
