[package]
name = "shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
egui = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[lints]
workspace = true

[features]
# Lets UI snapshots and tests show the Linux window controls on any platform,
# and paint stand-ins for the macOS traffic lights.
preview = []

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSResponder", "NSView", "NSButton", "NSControl"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Reads the desktop's title bar button layout from the settings portal.
zbus = "5.19.0"
