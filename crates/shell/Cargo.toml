[package]
name = "shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
egui = "0.37.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
unicode-normalization = "0.1.26"

[lints]
workspace = true

[features]
# Lets UI snapshots and tests show the Linux window controls on any platform,
# and paint stand-ins for the macOS traffic lights.
preview = []

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSWindow", "NSResponder", "NSView", "NSButton", "NSControl"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "alloc", "block2", "NSArray", "NSString", "NSValue", "NSDictionary", "NSData", "NSObject"] }
objc2-media-player = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Reads the desktop's title bar button layout from the settings portal.
zbus = "5.19.0"
